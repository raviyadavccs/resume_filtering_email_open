<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title or "Resume Filter" }}</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">Resume<span>Filter</span></a>
    {% if session.get('user_id') %}<a class="logout" href="{{ url_for('logout') }}">Log out</a>{% endif %}
  </header>
  <main class="container">
    {% with messages = get_flashed_messages() %}
      {% if messages %}<div class="flash-list">{% for message in messages %}<div class="flash">{{ message }}</div>{% endfor %}</div>{% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <script src="/script.js"></script>
</body>
</html>
